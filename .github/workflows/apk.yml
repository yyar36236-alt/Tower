name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          sudo chmod +x /opt/gradle/gradle-8.7/bin/gradle
          sudo ln -sf /opt/gradle/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version | head -6

      - name: Подготовить keystore
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > keystore/tower.jks
            echo "keystore: из секретов"
          else
            keytool -genkeypair -v -keystore keystore/tower.jks -storetype PKCS12 \
              -storepass tower2024 -keypass tower2024 -alias tower \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Tower, OU=Tower, O=Tower, L=Unknown, S=Unknown, C=RU"
            echo "keystore: сгенерирован на лету"
          fi

      - name: Собрать APK
        env:
          TOWER_KEYSTORE: ${{ github.workspace }}/keystore/tower.jks
          TOWER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'tower2024' }}
          TOWER_KEY_ALIAS: tower
          TOWER_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'tower2024' }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Собрать APK в папку out
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Tower-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Tower-v1.0.apk
          ls -lh out

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Tower-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Положить APK в репозиторий
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
        run: |
          mkdir -p release
          cp out/Tower-v1.0.apk release/Tower-v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/Tower-v1.0.apk
          if git diff --cached --quiet; then
            echo "APK не изменился — коммит не нужен"
          else
            git commit -m "chore: обновить APK сборки [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && break || sleep 5
            done
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Релиз GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && \
            gh release upload v1.0 out/Tower-v1.0.apk out/Tower-debug.apk --clobber --repo "${GITHUB_REPOSITORY}" || \
            gh release create v1.0 out/Tower-v1.0.apk out/Tower-debug.apk \
              --title "Tower v1.0 — плавающая панель видео" \
              --notes "Плавающая панель: 30 функций в 6 разделах, скорость 2X/3X/4X/5X/10X, пропуск рекламы, запись экрана, усиление звука." \
              --repo "${GITHUB_REPOSITORY}"
